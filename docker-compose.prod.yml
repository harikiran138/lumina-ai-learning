version: "3.9"

services:
  # ═════════════════════════════════════════════════════════════
  # PostgreSQL Database
  # ═════════════════════════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: lumina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumina}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres-prod-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  # ═════════════════════════════════════════════════════════════
  # Redis Cache & Queue
  # ═════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: lumina-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis-prod-password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  # ═════════════════════════════════════════════════════════════
  # Neo4j Graph Database
  # ═════════════════════════════════════════════════════════════
  neo4j:
    image: neo4j:5-community
    container_name: lumina-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j-prod-password}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - lumina-network

  # ═════════════════════════════════════════════════════════════
  # MinIO Object Storage
  # ═════════════════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: lumina-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-prod-password}
    command: server /data --console-address :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - lumina-network

  # ═════════════════════════════════════════════════════════════
  # FastAPI Backend
  # ═════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.slim
    container_name: lumina-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    networks:
      - lumina-network

  # ═════════════════════════════════════════════════════════════
  # Celery Worker
  # ═════════════════════════════════════════════════════════════
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.slim
    container_name: lumina-worker
    command: celery -A app.worker.celery_app worker --loglevel=info
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - ./backend/.env
    networks:
      - lumina-network

  # ═════════════════════════════════════════════════════════════
  # ML Service
  # ═════════════════════════════════════════════════════════════
  ml-service:
    build:
      context: ./backend
      dockerfile: ml_services/Dockerfile
    container_name: lumina-ml-service
    restart: unless-stopped
    ports:
      - "9010:9000"
    env_file:
      - ./backend/.env
    networks:
      - lumina-network

  # ═════════════════════════════════════════════════════════════
  # Next.js Frontend
  # ═════════════════════════════════════════════════════════════
  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
    container_name: lumina-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    env_file:
      - ./frontend/web/.env.local
    ports:
      - "3000:3000"
    networks:
      - lumina-network

  # ═════════════════════════════════════════════════════════════
  # Flower - Celery Monitoring
  # ═════════════════════════════════════════════════════════════
  flower:
    image: mher/flower
    container_name: lumina-flower
    environment:
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis-prod-password}@redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - worker
    networks:
      - lumina-network

  # ═════════════════════════════════════════════════════════════
  # Nginx Reverse Proxy
  # ═════════════════════════════════════════════════════════════
  nginx:
    image: nginx:stable-alpine
    container_name: lumina-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/aws/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - lumina-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  minio_data:
    driver: local

networks:
  lumina-network:
    driver: bridge
