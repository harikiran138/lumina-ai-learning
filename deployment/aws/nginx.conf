# ============================================================
# Lumina AI Learning — Nginx Reverse Proxy
# ============================================================
# Routes:
#   /          → Next.js frontend (port 3000)
#   /api/      → FastAPI backend  (port 8000)
#   /health    → FastAPI backend  (port 8000)
#   /ws/       → FastAPI backend WebSocket (port 8000)
#   /docs      → FastAPI Swagger UI (port 8000)
#   /redoc     → FastAPI ReDoc    (port 8000)
#
# HTTPS: Uncomment the HTTPS server block after running Certbot.
# ============================================================

upstream frontend {
    server frontend:3000;
    keepalive 32;
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

# ─── Rate Limiting Zones ────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# ─── HTTP Server (port 80) ──────────────────────────────────
server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # Upload size limit
    client_max_body_size 50M;

    # ── Let's Encrypt ACME challenge (needed for Certbot) ────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Backend API ──────────────────────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_read_timeout    300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout    300s;

        # CORS headers (backend also sets them; nginx passes through)
        proxy_pass_header Access-Control-Allow-Origin;
    }

    # ── Auth endpoints — stricter rate limit ─────────────────
    location ~ ^/api/(auth|login|register) {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Health check (no auth, no rate limit) ────────────────
    location = /health {
        proxy_pass         http://backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── FastAPI docs (disable in prod if not needed) ─────────
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── WebSocket support (real-time features) ───────────────
    location /ws/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
    }

    # ── Next.js frontend (everything else) ───────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;

        # Next.js HMR and static assets
        proxy_buffering off;
    }

    # ── Static asset caching ─────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;

        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

