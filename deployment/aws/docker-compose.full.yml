# ============================================================
# Lumina AI Learning — Full Production Stack (EC2)
# ============================================================
# Builds all images from source on the EC2 server.
# Used by deploy.sh for the "build-on-server" workflow.
#
# Port mapping summary (host ports exposed):
#   80   → nginx  (HTTP, frontend + /api proxy)
#   443  → nginx  (HTTPS, after certbot setup)
#   8000 → backend (direct access, optional)
#   5555 → flower  (Celery monitor, optional)
#   9001 → MinIO console (admin UI)
#   7474 → Neo4j HTTP browser (admin UI)
#
# Internal-only (no host binding):
#   ml-service:9000, minio:9000, redis:6379, postgres:5432

version: "3.9"

services:

  # ─────────────────────────────────────────────
  # INFRASTRUCTURE
  # ─────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lumina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumina_db_pass}
      POSTGRES_DB: ${POSTGRES_DB:-lumina_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumina} -d ${POSTGRES_DB:-lumina_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_pass}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "7474:7474"   # Neo4j Browser (admin UI — close in prod if not needed)
      - "7687:7687"   # Bolt protocol (required by backend)
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_pass}
    ports:
      - "9001:9001"   # MinIO Console (admin UI)
      # Port 9000 (API) is internal only — backend uses minio:9000
    volumes:
      - minio_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # APPLICATION SERVICES (built from source)
  # ─────────────────────────────────────────────

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      MINIO_ENDPOINT: minio:9000
      ML_SERVICE_URL: http://ml-service:9000
      CHROMA_DB_PATH: /app/db/chroma
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"   # Exposed for direct API access + health checks
    volumes:
      - uploads_data:/app/data/uploads
      - chroma_data:/app/db/chroma
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2 --pool=prefork
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ML_SERVICE_URL: http://ml-service:9000
      CHROMA_DB_PATH: /app/db/chroma
      PYTHONUNBUFFERED: "1"
    volumes:
      - uploads_data:/app/data/uploads
      - chroma_data:/app/db/chroma
    depends_on:
      - redis
      - backend
    networks:
      - app-network

  ml-service:
    build:
      context: ../../backend
      dockerfile: ml_services/Dockerfile
    command: uvicorn ml_services.main:app --host 0.0.0.0 --port 9000 --workers 1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CHROMA_DB_PATH: /app/db/chroma
      PYTHONUNBUFFERED: "1"
    # No host port — backend accesses via ml-service:9000 on internal network
    volumes:
      - chroma_data:/app/db/chroma
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  flower:
    image: mher/flower:2.0
    restart: unless-stopped
    command: celery --broker=redis://redis:6379/0 flower --port=5555
    ports:
      - "127.0.0.1:5555:5555"  # Localhost only — expose via SSH tunnel if needed
    depends_on:
      - redis
    networks:
      - app-network

  frontend:
    build:
      context: ../../frontend/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  # ─────────────────────────────────────────────
  # REVERSE PROXY
  # ─────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_certs:/etc/letsencrypt
      - nginx_www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
  uploads_data:
  chroma_data:
  nginx_certs:
  nginx_www:

networks:
  app-network:
    driver: bridge
