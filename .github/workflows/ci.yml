name: Lumina CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Standard Testing (Python)
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx motor locust
      - name: Run Pytest
        run: |
          cd backend
          python -m pytest tests

  # 2. Security: SAST (Semgrep)
  security-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: "p/ci"

  # 3. Security: Python Specific (Bandit)
  security-bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        run: bandit -c .bandit -r backend/ -iii

  # 4. API Testing (Newman)
  test-api-newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Newman
        run: npm install -g newman
      - name: Run Newman Tests
        run: |
          echo "Validating API Collection..."
          newman run backend/tests/api_tests.json --suppress-exit-code

  # 5. RAG Quality (RAGAS)
  eval-rag-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install ragas datasets pandas
      - name: Run RAGAS Eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY not found. Skipping evaluation."
          else
            python backend/tests/rag_eval.py
          fi

  # 6. UI Testing (Jest/Playwright)
  test-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend/web
          npm install
      - name: Run Jest
        run: |
          cd frontend/web
          npm test

  # 7. Container Validation (Docker)
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Image
        run: |
          cd backend
          docker build -t lumina-backend:latest .
      - name: Build Frontend Image
        run: |
          cd frontend/web
          docker build -t lumina-frontend:latest .
