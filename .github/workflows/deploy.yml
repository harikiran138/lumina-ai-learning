name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Trigger on push to main branch

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'main'

env:
  AWS_REGION: ap-south-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to EC2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EC2 Instance IP
        id: instance
        run: |
          IP=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=lumina" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)
          echo "ip=$IP" >> $GITHUB_OUTPUT
          if [ "$IP" == "None" ] || [ -z "$IP" ]; then
            echo "ERROR: Could not find EC2 instance 'lumina'"
            exit 1
          fi
          echo "Instance IP: $IP"

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_EC2_PRIVATE_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ steps.instance.outputs.ip }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to EC2
        run: |
          ssh -i ~/.ssh/deploy_key.pem ${{ secrets.AWS_EC2_USER }}@${{ steps.instance.outputs.ip }} \
            "cd /home/ubuntu/lumina-ai-learning && /home/ubuntu/lumina-ai-learning/deploy/deploy.sh main"

      - name: Verify Deployment
        run: |
          # Give services time to start
          sleep 30

          # Check if backend is responding
          BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ steps.instance.outputs.ip }}/api/health || echo "000")
          if [ "$BACKEND_STATUS" == "200" ]; then
            echo "✓ Backend is responding"
          else
            echo "✗ Backend health check failed (HTTP $BACKEND_STATUS)"
            exit 1
          fi

          # Check if frontend is responding
          FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://${{ steps.instance.outputs.ip }}/ || echo "000")
          if [ "$FRONTEND_STATUS" == "200" ] || [ "$FRONTEND_STATUS" == "301" ] || [ "$FRONTEND_STATUS" == "302" ]; then
            echo "✓ Frontend is responding"
          else
            echo "⚠ Frontend check returned HTTP $FRONTEND_STATUS (may be warming up)"
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key.pem

      - name: Deployment Summary
        run: |
          echo "## Deployment Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: main" >> $GITHUB_STEP_SUMMARY
          echo "- **EC2 Instance**: ${{ steps.instance.outputs.ip }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://${{ steps.instance.outputs.ip }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API**: https://${{ steps.instance.outputs.ip }}/api" >> $GITHUB_STEP_SUMMARY
          echo "- **Logs**: Check EC2 instance for detailed logs" >> $GITHUB_STEP_SUMMARY

  # Optional: Send Slack notification
  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    
    steps:
      - name: Slack Notification
        uses: 8398a7/action-slack@v3
        if: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          status: ${{ job.status }}
          text: 'Lumina AI Platform deployment to AWS EC2 - ${{ job.status }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        continue-on-error: true
