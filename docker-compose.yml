version: "3.8"
services:
  redis:
    image: redis:7
    ports: ["6379:6379"]
    networks:
      - lumina-net

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init-db:/docker-entrypoint-initdb.d
    networks:
      - lumina-net
    ports: ["5432:5432"]

  # MinIO for object storage (Artifacts, PDFs)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - miniodata:/data
    networks:
      - lumina-net
    ports: 
      - "9000:9000"
      - "9001:9001"

  api:
    build: 
      context: ./backend
    container_name: lumina-api
    depends_on: ["redis", "db", "minio"]
    ports: ["8000:8000"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://app:changeme@db:5432/appdb
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
      - OLLAMA_HOST=http://host.docker.internal:11434/v1
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - lumina-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build: 
      context: ./backend
    container_name: lumina-worker
    command: ["python", "worker.py"]
    depends_on: ["redis", "db", "minio"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://app:changeme@db:5432/appdb
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minio
      - MINIO_SECRET_KEY=minio123
      - OLLAMA_HOST=http://host.docker.internal:11434/v1
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - lumina-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  miniodata:

networks:
  lumina-net:
