version: "3.8"

# ================================================================
# Lumina — Local Development Compose
# Lightweight: only postgres + redis run locally.
# Neo4j, MinIO, Prometheus, Grafana removed (use AWS managed services).
# For production, use: docker-compose.aws.yml
# ================================================================

services:
  # ── Local Datastores (dev only) ────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina_password
      POSTGRES_DB: lumina_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Application Services ──────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://lumina:lumina_password@db:5432/lumina_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - ML_SERVICE_URL=http://ml-service:9000
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://lumina:lumina_password@db:5432/lumina_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME:-}
      - ENVIRONMENT=development
    depends_on:
      - redis
    networks:
      - app-network

  ml-service:
    build:
      context: ./backend
      dockerfile: ml_services/Dockerfile
    command: uvicorn ml_services.main:app --host 0.0.0.0 --port 9000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "9000:9000"
    environment:
      - DATABASE_URL=postgresql://lumina:lumina_password@db:5432/lumina_db
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    ports:
      - "8001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:
  redis_data:

networks:
  app-network:
    driver: bridge

# Removed from dev compose (use AWS managed services or run separately):
#   neo4j     → Neo4j AuraDB Free:  see infra/neo4j.md
#   minio     → AWS S3:              see infra/rds.md  (storage.py already uses S3)
#   prometheus → AWS CloudWatch:     see infra/cloudwatch-dashboard.json
#   grafana   → AWS CloudWatch:      dashboards are in infra/cloudwatch-dashboard.json
#   flower    → Run locally if needed: docker run -p 5555:5555 mher/flower
