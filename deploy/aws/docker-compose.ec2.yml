services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no --save "" --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      PYTHONUNBUFFERED: "1"
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/data/uploads
      - chroma_data:/app/db/chroma
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1 --pool=solo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      PYTHONUNBUFFERED: "1"
    depends_on:
      - redis
      - backend
    volumes:
      - uploads_data:/app/data/uploads
      - chroma_data:/app/db/chroma

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "80:3000"
      - "8001:3000"

volumes:
  redis_data:
  uploads_data:
  chroma_data:
