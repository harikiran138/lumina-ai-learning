# Lumina AI Learning Platform - Production Nginx Configuration
# This configuration serves as a reverse proxy for the entire application
# It handles SSL/TLS termination, routing, and load balancing

# ═════════════════════════════════════════════════════════════════════════════
# Upstream Service Definitions
# ═════════════════════════════════════════════════════════════════════════════

upstream frontend {
    # Next.js Frontend
    server frontend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream backend {
    # FastAPI Backend with load balancing
    server backend:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ═════════════════════════════════════════════════════════════════════════════
# Rate Limiting
# ═════════════════════════════════════════════════════════════════════════════

limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

# ═════════════════════════════════════════════════════════════════════════════
# Redirect HTTP to HTTPS
# ═════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Let's Encrypt certificate validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ═════════════════════════════════════════════════════════════════════════════
# HTTPS Server Configuration
# ═════════════════════════════════════════════════════════════════════════════

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;
    client_max_body_size 100M;  # Allow large file uploads

    # ─────────────────────────────────────────────────────────────────────────
    # SSL/TLS Configuration
    # ─────────────────────────────────────────────────────────────────────────

    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL/TLS Best Practices
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/your-domain.com/chain.pem;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "geolocation=(),microphone=(),camera=()" always;

    # ─────────────────────────────────────────────────────────────────────────
    # Logging
    # ─────────────────────────────────────────────────────────────────────────

    access_log /var/log/nginx/lumina-access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/lumina-error.log warn;

    # ─────────────────────────────────────────────────────────────────────────
    # API Routes (Backend)
    # ─────────────────────────────────────────────────────────────────────────

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        # Authentication routes get stricter rate limiting
        location /api/auth/ {
            limit_req zone=auth_limit burst=2 nodelay;
            proxy_pass http://backend;
            include proxy_params.conf;
        }

        # Main API proxy
        proxy_pass http://backend;
        include proxy_params.conf;

        # Increase timeouts for long-running operations (ML, file uploads)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Health Check Endpoint
    # ─────────────────────────────────────────────────────────────────────────

    location /health {
        access_log off;
        proxy_pass http://backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Static Assets (Frontend)
    # ─────────────────────────────────────────────────────────────────────────

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://frontend;
        include proxy_params.conf;

        # Static assets can be cached aggressively
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # All Other Routes (Frontend SPA)
    # ─────────────────────────────────────────────────────────────────────────

    location / {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://frontend;
        include proxy_params.conf;

        # Don't cache HTML (SPA routing)
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Deny Access to Sensitive Files
    # ─────────────────────────────────────────────────────────────────────────

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

