##
## Lumina — Nginx Reverse Proxy
## Handles: API routing, WebSocket upgrade, static assets, CORS
##

upstream backend {
    server backend:8000;
    keepalive 16;
}

upstream frontend {
    server frontend:3000;
    keepalive 8;
}

# ── HTTP → HTTPS redirect (uncomment after SSL is configured) ─────────────────
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

# ── Main server block ─────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Request size limits ───────────────────────────────────────────────────
    client_max_body_size 50M;   # Assignment PDF / video uploads
    client_body_timeout  60s;

    # ── Health check (no logging) ─────────────────────────────────────────────
    location = /health {
        proxy_pass http://backend/health;
        access_log off;
    }

    # ── API routes → FastAPI backend ──────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts for long-running ML requests
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
    }

    # ── WebSocket — AI Tutor real-time chat ───────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;   # Keep WS open for up to 1 hour
    }

    # ── Next.js static assets (cached aggressively) ───────────────────────────
    location /_next/static/ {
        proxy_pass         http://frontend/_next/static/;
        proxy_cache_valid  200 365d;
        add_header         Cache-Control "public, max-age=31536000, immutable";
        access_log         off;
    }

    # ── Frontend → Next.js ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

