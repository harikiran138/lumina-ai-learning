prompts:
  - "Create a learning module about Photosynthesis for a 5th grade student."
  - "Explain Quantum Physics to a high schooler using analogies."
  - "Generate a math quiz for basic algebra."

providers:
  - id: python:test_provider.py
    label: "Lumina-Ollama-Local"

tests:
  - description: "Check JSON Structure"
    assert:
      - type: is-json
      - type: javascript
        value: "output.educational_level && output.content"
