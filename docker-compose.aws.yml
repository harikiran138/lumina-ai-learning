version: "3.9"

# ================================================================
# Lumina — AWS Production Compose
# Runs on: EC2 t3.large (8 GB RAM, 2 vCPU), 20 GB EBS gp3
#
# External managed services (NOT in this compose):
#   Database  → AWS RDS PostgreSQL (db.t3.micro)
#   Cache     → AWS ElastiCache Redis (cache.t3.micro)
#   Storage   → AWS S3
#   Graph DB  → Neo4j AuraDB Free
#   Metrics   → AWS CloudWatch
#
# Services in this compose:
#   backend, worker, ml-service, frontend, nginx
#
# Usage:
#   cp infra/aws/.env.aws backend/.env   # fill in secrets first
#   docker compose -f docker-compose.aws.yml up -d --build
# ================================================================

x-common: &common
  env_file: ./backend/.env
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - lumina-net

services:

  # ── Redis (in-container, ElastiCache not available via current IAM) ─────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    networks:
      - lumina-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── API Server ──────────────────────────────────────────────────────────────
  backend:
    <<: *common
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ── Celery Worker ───────────────────────────────────────────────────────────
  worker:
    <<: *common
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    command: >
      celery -A app.worker.celery_app worker
        --loglevel=info
        --concurrency=2
        --max-tasks-per-child=50
        --queues=default,ml_tasks,notifications
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M

  # ── ML Service ──────────────────────────────────────────────────────────────
  ml-service:
    <<: *common
    build:
      context: ./backend
      dockerfile: ml_services/Dockerfile
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # Headroom for when TrOCR is loaded (~2.5 GB peak)
          memory: 2G
        reservations:
          # Idle with lazy loading — models not pre-loaded
          memory: 512M

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    <<: *common
    env_file: []  # frontend uses its own env
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 200M

  # ── Nginx Reverse Proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/lumina.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - lumina-net
    deploy:
      resources:
        limits:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  lumina-net:
    driver: bridge

# No volumes section — all persistent data lives in AWS managed services.
# Local ephemeral uploads use /tmp within containers (backed by S3 in worker).
