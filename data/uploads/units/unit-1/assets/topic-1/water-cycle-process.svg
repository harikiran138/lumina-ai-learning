<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='900' viewBox='0 0 1400 900'><rect x='40' y='30' width='1320' height='80' rx='20' fill='#14532d' /><text x='70' y='78' font-size='28' fill='white'>Water Cycle Process</text><rect x='120' y='170' width='500' height='90' rx='18' fill='#dcfce7' stroke='#166534' stroke-width='3' /><text x='140' y='222' font-size='24' fill='#052e16'>1. Identify the water source</text><rect x='740' y='170' width='500' height='90' rx='18' fill='#dcfce7' stroke='#166534' stroke-width='3' /><text x='760' y='222' font-size='24' fill='#052e16'>2. Evaporation of water from oceans, lakes, rivers, etc.</text><rect x='120' y='350' width='500' height='90' rx='18' fill='#dcfce7' stroke='#166534' stroke-width='3' /><text x='140' y='402' font-size='24' fill='#052e16'>3. Condensation - Water vapor turning back into liquid for</text><rect x='740' y='350' width='500' height='90' rx='18' fill='#dcfce7' stroke='#166534' stroke-width='3' /><text x='760' y='402' font-size='24' fill='#052e16'>4. Precipitation - Water falling as rain, snow, sleet, or </text><rect x='120' y='530' width='500' height='90' rx='18' fill='#dcfce7' stroke='#166534' stroke-width='3' /><text x='140' y='582' font-size='24' fill='#052e16'>5. Collection of precipitation on Earth&apos;s surface</text></svg>